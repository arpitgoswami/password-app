<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Password Generator Application</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --bg: #eef0fa;
        --panel: #ffffff;
        --ink: #14142b;
        --violet: #6c5ce7;
        --violet-dark: #4b3fbf;
        --violet-light: #b9b1ff;
        --dark-box: #171827;
        --dark-box-text: #f4f4ff;
        --border: #14142b;
        --mint: #7ee0c3;
        --sky-top: #dfe4fb;
        --sky-bottom: #f3eefc;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        min-height: 100%;
        background: linear-gradient(180deg, var(--sky-top), var(--sky-bottom));
        color: var(--ink);
        font-family: "VT323", monospace;
        font-size: 20px;
        -webkit-font-smoothing: none;
        image-rendering: pixelated;
      }

      h1,
      h2,
      h3,
      .pixel-font {
        font-family: "Press Start 2P", monospace;
      }

      /* ---------- pixel background scene ---------- */
      .scene {
        position: fixed;
        inset: 0;
        z-index: -1;
        overflow: hidden;
      }

      .cloud {
        position: absolute;
        background: #ffffff;
        opacity: 0.8;
        box-shadow:
          16px 0 0 0 #ffffff,
          32px 0 0 0 #ffffff,
          16px -12px 0 0 #ffffff,
          32px -12px 0 0 #ffffff,
          0 12px 0 0 #ffffff,
          16px 12px 0 0 #ffffff,
          32px 12px 0 0 #ffffff,
          48px 12px 0 0 #ffffff;
        width: 12px;
        height: 12px;
        image-rendering: pixelated;
      }
      .cloud.c1 {
        top: 8%;
        left: 4%;
        transform: scale(1.4);
        opacity: 0.7;
      }
      .cloud.c2 {
        top: 14%;
        right: 6%;
        transform: scale(1.1);
        opacity: 0.6;
      }
      .cloud.c3 {
        top: 40%;
        left: 80%;
        transform: scale(0.9);
        opacity: 0.5;
      }
      .cloud.c4 {
        top: 55%;
        left: 2%;
        transform: scale(0.8);
        opacity: 0.45;
      }

      .mountains {
        position: absolute;
        bottom: 0;
        left: 0;
        right: 0;
        height: 42vh;
        min-height: 220px;
        background: linear-gradient(transparent, transparent);
      }
      .range {
        position: absolute;
        bottom: 0;
        width: 100%;
        height: 100%;
        display: block;
      }
      .range svg {
        width: 100%;
        height: 100%;
        display: block;
      }

      .stars-toggle-icon {
        width: 16px;
        height: 16px;
      }

      /* ---------- layout ---------- */
      .wrap {
        position: relative;
        max-width: 900px;
        margin: 0 auto;
        padding: 20px 18px 60px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        flex-wrap: wrap;
        padding: 10px 4px 26px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .brand-icon {
        width: 16px;
        height: 16px;
        background: var(--violet);
        border: 3px solid var(--ink);
      }
      .brand-name {
        font-size: 15px;
        letter-spacing: 1px;
      }

      nav {
        display: flex;
        gap: 6px;
        background: var(--panel);
        border: 3px solid var(--ink);
        padding: 4px;
        box-shadow: 3px 3px 0 var(--ink);
      }
      nav button {
        font-family: "VT323", monospace;
        font-size: 18px;
        background: transparent;
        border: none;
        padding: 6px 14px;
        cursor: pointer;
        color: var(--ink);
      }
      nav button.active {
        background: var(--ink);
        color: #fff;
      }

      .tagline {
        text-align: center;
        font-size: 16px;
        letter-spacing: 3px;
        color: var(--violet-dark);
        margin-bottom: 8px;
      }

      h1.title {
        text-align: center;
        font-size: 30px;
        line-height: 1.6;
        margin: 6px 0 10px;
      }
      h1.title span {
        color: var(--violet);
        display: inline-block;
      }

      .subtitle {
        text-align: center;
        font-size: 20px;
        color: #4b4b63;
        margin-bottom: 28px;
      }

      /* password display */
      .pass-box {
        background: var(--dark-box);
        border: 3px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 16px;
        margin-bottom: 22px;
      }
      .pass-text {
        flex: 1;
        color: var(--dark-box-text);
        font-family: "VT323", monospace;
        font-size: 26px;
        letter-spacing: 2px;
        overflow-x: auto;
        white-space: nowrap;
        padding: 4px 2px;
      }
      .icon-btn {
        min-width: 64px;
        height: 44px;
        flex: 0 0 auto;
        border: 3px solid var(--ink);
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        font-family: "VT323", monospace;
        font-size: 17px;
        letter-spacing: 1px;
        padding: 0 12px;
        background: #3a3b52;
        color: #fff;
        box-shadow: 3px 3px 0 var(--ink);
        transition: transform 0.06s ease;
      }
      .icon-btn:active {
        transform: translate(2px, 2px);
        box-shadow: 1px 1px 0 var(--ink);
      }
      .icon-btn.refresh {
        background: var(--violet);
      }
      .icon-btn.copied {
        background: var(--mint);
        color: #14142b;
      }

      /* controls panel */
      .panel {
        background: var(--panel);
        border: 3px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        padding: 22px;
      }

      .length-row {
        display: flex;
        justify-content: space-between;
        align-items: baseline;
        margin-bottom: 10px;
        font-size: 18px;
      }
      .length-row b {
        font-size: 22px;
      }

      input[type="range"] {
        width: 100%;
        appearance: none;
        -webkit-appearance: none;
        height: 10px;
        background: #e2e2f0;
        border: 2px solid var(--ink);
        margin-bottom: 4px;
      }
      input[type="range"]::-webkit-slider-thumb {
        -webkit-appearance: none;
        width: 22px;
        height: 22px;
        background: var(--panel);
        border: 3px solid var(--violet);
        cursor: pointer;
      }
      input[type="range"]::-moz-range-thumb {
        width: 18px;
        height: 18px;
        background: var(--panel);
        border: 3px solid var(--violet);
        cursor: pointer;
      }

      .range-labels {
        display: flex;
        justify-content: space-between;
        font-size: 16px;
        color: #666;
        margin-bottom: 20px;
      }

      .opts {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px 18px;
        margin-bottom: 22px;
      }
      .opt {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 18px;
        cursor: pointer;
        user-select: none;
      }
      .opt input {
        display: none;
      }
      .checkbox {
        width: 24px;
        height: 24px;
        border: 3px solid var(--ink);
        background: #fff;
        flex: 0 0 auto;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        color: #fff;
      }
      .opt input:checked + .checkbox {
        background: var(--violet);
      }

      .generate-btn {
        width: 100%;
        background: var(--violet);
        color: #fff;
        border: 3px solid var(--ink);
        box-shadow: 4px 4px 0 var(--ink);
        padding: 16px;
        font-family: "VT323", monospace;
        font-size: 22px;
        letter-spacing: 2px;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        transition: transform 0.06s ease;
      }
      .generate-btn:active {
        transform: translate(3px, 3px);
        box-shadow: 1px 1px 0 var(--ink);
      }

      .strength {
        margin-top: 14px;
        font-size: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .strength-bar {
        flex: 1;
        height: 10px;
        background: #e2e2f0;
        border: 2px solid var(--ink);
        position: relative;
        overflow: hidden;
      }
      .strength-fill {
        height: 100%;
        width: 0%;
        background: var(--violet);
        transition:
          width 0.2s ease,
          background 0.2s ease;
      }

      /* feature row */
      .features {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 16px;
        margin-top: 30px;
        text-align: center;
      }
      .feature b {
        display: block;
        font-size: 13px;
        margin: 8px 0 4px;
        letter-spacing: 1px;
      }
      .feature span {
        font-size: 16px;
        color: #555;
      }
      .feature .ico {
        font-size: 24px;
      }

      footer {
        text-align: center;
        margin-top: 40px;
        font-size: 15px;
        color: #555;
      }

      @media (max-width: 560px) {
        h1.title {
          font-size: 22px;
        }
        .pass-text {
          font-size: 20px;
        }
        .opts {
          grid-template-columns: 1fr;
        }
        .features {
          grid-template-columns: 1fr;
        }
        nav button {
          padding: 6px 10px;
          font-size: 16px;
        }
        .brand-name {
          font-size: 13px;
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1 class="title pixel-font">PASSWORD <span>GENERATOR</span></h1>
      <p class="subtitle">Create strong, random passwords in seconds.</p>

      <div class="pass-box">
        <div class="pass-text" id="passOutput">K8x!mP3@qL9v#T2f</div>
        <div class="icon-btn" id="copyBtn" title="Copy password">COPY</div>
        <div class="icon-btn refresh" id="genBtn" title="Generate new password">
          REFRESH
        </div>
      </div>

      <div class="panel">
        <div class="length-row">
          <span>LENGTH:</span>
          <b id="lengthVal">16</b>
        </div>
        <input type="range" id="lengthSlider" min="4" max="64" value="16" />
        <div class="range-labels"><span>4</span><span>64</span></div>

        <div class="opts">
          <label class="opt">
            <input type="checkbox" id="optUpper" checked />
            <span class="checkbox">✓</span>
            UPPERCASE (A-Z)
          </label>
          <label class="opt">
            <input type="checkbox" id="optNumbers" checked />
            <span class="checkbox">✓</span>
            NUMBERS (0-9)
          </label>
          <label class="opt">
            <input type="checkbox" id="optLower" checked />
            <span class="checkbox">✓</span>
            lowercase (a-z)
          </label>
          <label class="opt">
            <input type="checkbox" id="optSymbols" checked />
            <span class="checkbox">✓</span>
            SYMBOLS (!@#...)
          </label>
        </div>

        <button class="generate-btn" id="generateBtn">GENERATE PASSWORD</button>

        <div class="strength">
          <span id="strengthLabel">STRONG</span>
          <div class="strength-bar">
            <div class="strength-fill" id="strengthFill"></div>
          </div>
        </div>
      </div>
    </div>

    <script>
      const lower = "abcdefghijklmnopqrstuvwxyz";
      const upper = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";
      const numbers = "0123456789";
      const symbols = "!@#$%^&*()_+-=[]{}|;:,.<>?";

      const lengthSlider = document.getElementById("lengthSlider");
      const lengthVal = document.getElementById("lengthVal");
      const optUpper = document.getElementById("optUpper");
      const optLower = document.getElementById("optLower");
      const optNumbers = document.getElementById("optNumbers");
      const optSymbols = document.getElementById("optSymbols");
      const passOutput = document.getElementById("passOutput");
      const generateBtn = document.getElementById("generateBtn");
      const genBtn = document.getElementById("genBtn");
      const copyBtn = document.getElementById("copyBtn");
      const strengthFill = document.getElementById("strengthFill");
      const strengthLabel = document.getElementById("strengthLabel");

      function randInt(max) {
        const arr = new Uint32Array(1);
        crypto.getRandomValues(arr);
        return arr[0] % max;
      }

      function generatePassword() {
        let charset = "";
        if (optUpper.checked) charset += upper;
        if (optLower.checked) charset += lower;
        if (optNumbers.checked) charset += numbers;
        if (optSymbols.checked) charset += symbols;

        if (!charset) {
          passOutput.textContent = "Pick at least one option!";
          updateStrength(0);
          return;
        }

        const len = parseInt(lengthSlider.value, 10);
        let pass = "";
        for (let i = 0; i < len; i++) {
          pass += charset[randInt(charset.length)];
        }
        passOutput.textContent = pass;
        updateStrength(scorePassword(pass, len));
      }

      function scorePassword(pass, len) {
        let variety = 0;
        if (optUpper.checked) variety++;
        if (optLower.checked) variety++;
        if (optNumbers.checked) variety++;
        if (optSymbols.checked) variety++;
        let score = (len / 64) * 60 + (variety / 4) * 40;
        return Math.min(100, Math.round(score));
      }

      function updateStrength(score) {
        strengthFill.style.width = score + "%";
        let label = "WEAK",
          color = "#e06c6c";
        if (score > 80) {
          label = "VERY STRONG";
          color = "#6c5ce7";
        } else if (score > 60) {
          label = "STRONG";
          color = "#7ee0c3";
        } else if (score > 35) {
          label = "FAIR";
          color = "#f0c869";
        }
        strengthFill.style.background = color;
        strengthLabel.textContent = label;
      }

      lengthSlider.addEventListener("input", () => {
        lengthVal.textContent = lengthSlider.value;
        generatePassword();
      });

      [optUpper, optLower, optNumbers, optSymbols].forEach((el) => {
        el.addEventListener("change", generatePassword);
      });

      generateBtn.addEventListener("click", generatePassword);
      genBtn.addEventListener("click", generatePassword);

      copyBtn.addEventListener("click", () => {
        const text = passOutput.textContent;
        if (!text || text === "Pick at least one option!") return;
        navigator.clipboard.writeText(text).then(() => {
          copyBtn.textContent = "DONE";
          copyBtn.classList.add("copied");
          setTimeout(() => {
            copyBtn.textContent = "COPY";
            copyBtn.classList.remove("copied");
          }, 1200);
        });
      });

      // initial
      generatePassword();
    </script>
  </body>
</html>
