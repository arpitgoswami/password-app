<!doctype html>
<html lang="en" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Password Generator Application</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script>
      tailwind.config = {
        darkMode: "class",
      };
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap"
      rel="stylesheet"
    />

    <link rel="icon" type="image/x-icon" href="favicon.ico" />
  </head>

  <body
    class="min-h-screen overflow-x-hidden bg-[#eef1ff] font-['VT323'] text-[#171b32] transition-colors duration-300 dark:bg-[#0d1122] dark:text-[#f2f4ff]"
  >
    <!-- BACKGROUNDS -->

    <img
      src="/images/background.png"
      id="lightBackground"
      class="fixed inset-0 -z-20 h-full w-full object-cover"
      alt=""
    />

    <img
      src="/images/background-dark.png"
      id="darkBackground"
      class="fixed inset-0 -z-20 hidden h-full w-full object-cover"
      alt=""
    />

    <!-- BACKGROUND OVERLAY -->

    <div
      class="fixed inset-0 -z-10 bg-gradient-to-b from-white/80 via-white/45 to-white/15 dark:from-[#080b17]/90 dark:via-[#080b17]/65 dark:to-[#080b17]/35"
    ></div>

    <!-- THEME BUTTON -->

    <button
      id="themeButton"
      aria-label="Toggle theme"
      class="fixed right-5 top-5 z-50 grid h-11 w-11 place-items-center border-2 border-[#cdd2e9] bg-white/80 text-[#171b32] shadow-[3px_3px_0_rgba(29,35,66,0.14)] backdrop-blur-md transition hover:-translate-y-0.5 active:translate-x-0.5 active:translate-y-0.5 dark:border-[#343c5d] dark:bg-[#13182c]/85 dark:text-white"
    >
      <!-- SUN -->

      <svg
        id="sunIcon"
        class="h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <circle cx="12" cy="12" r="4"></circle>

        <path
          d="
        M12 2v2
        M12 20v2
        M4.93 4.93l1.41 1.41
        M17.66 17.66l1.41 1.41
        M2 12h2
        M20 12h2
        M4.93 19.07l1.41-1.41
        M17.66 6.34l1.41-1.41
      "
        ></path>
      </svg>

      <!-- MOON -->

      <svg
        id="moonIcon"
        class="hidden h-5 w-5"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2"
      >
        <path
          d="M20.5 14.5A8.5 8.5 0 0 1 9.5 3.5A8.5 8.5 0 1 0 20.5 14.5Z"
        ></path>
      </svg>
    </button>

    <!-- PAGE -->

    <main class="mx-auto w-[min(760px,calc(100%-32px))] py-20 sm:py-24">
      <!-- HEADER -->

      <header class="mb-7 text-center">
        <h1
          class="font-['Press_Start_2P'] text-[25px] leading-[1.55] tracking-[-1px] sm:text-[38px]"
        >
          PASSWORD
          <br />

          <span class="text-[#6852ed]"> GENERATOR </span>
        </h1>

        <p class="mt-3 text-lg text-[#727a99] dark:text-[#929bb9] sm:text-xl">
          Create a strong password in seconds.
        </p>
      </header>

      <!-- APP -->

      <section class="flex flex-col gap-4">
        <!-- PASSWORD DISPLAY -->

        <div
          class="relative flex min-h-[84px] items-center overflow-hidden border-2 border-[#15192d] bg-[#15192d] p-3 shadow-[5px_5px_0_rgba(29,35,66,0.14)]"
        >
          <!-- LEFT ACCENT -->

          <div class="absolute left-0 top-0 h-full w-1 bg-[#6852ed]"></div>

          <!-- PASSWORD -->

          <div
            id="password"
            class="min-w-0 flex-1 overflow-x-auto whitespace-nowrap px-3 text-[22px] tracking-[2px] text-white scrollbar-hide sm:text-[27px]"
          >
            K8x!mP3@qL9v#T2f
          </div>

          <!-- ACTIONS -->

          <div class="flex gap-1.5">
            <!-- COPY -->

            <button
              id="copyButton"
              title="Copy password"
              class="group grid h-11 w-11 place-items-center bg-[#202641] text-white transition hover:bg-[#303854] active:translate-x-0.5 active:translate-y-0.5 sm:h-12 sm:w-12"
            >
              <svg
                id="copyIcon"
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <rect x="8" y="8" width="12" height="12" rx="1"></rect>

                <path
                  d="
                M16 8V5
                a1 1 0 0 0-1-1
                H5
                a1 1 0 0 0-1 1
                v10
                a1 1 0 0 0 1 1
                h3
              "
                ></path>
              </svg>
            </button>

            <!-- REFRESH -->

            <button
              id="refreshButton"
              title="Generate password"
              class="grid h-11 w-11 place-items-center bg-[#6852ed] text-white transition hover:bg-[#8068ff] active:translate-x-0.5 active:translate-y-0.5 sm:h-12 sm:w-12"
            >
              <svg
                class="h-5 w-5"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
              >
                <path d="M20 11a8 8 0 0 0-14-5L4 8"></path>
                <path d="M4 4v4h4"></path>

                <path d="M4 13a8 8 0 0 0 14 5l2-2"></path>
                <path d="M20 20v-4h-4"></path>
              </svg>
            </button>
          </div>
        </div>

        <!-- CONTROLS -->

        <div
          class="border-2 border-[#cdd2e9] bg-white/80 p-5 shadow-[5px_5px_0_rgba(29,35,66,0.10)] backdrop-blur-xl dark:border-[#343c5d] dark:bg-[#13182c]/85 sm:p-6"
        >
          <!-- LENGTH HEADER -->

          <div class="mb-3 flex items-center justify-between">
            <span
              class="text-lg tracking-[2px] text-[#727a99] dark:text-[#929bb9]"
            >
              PASSWORD LENGTH
            </span>

            <strong id="lengthValue" class="text-[29px] text-[#6852ed]">
              16
            </strong>
          </div>

          <!-- SLIDER -->

          <div class="relative h-5">
            <div
              class="absolute left-0 top-2 h-2 w-full bg-[#cdd2e9] dark:bg-[#343c5d]"
            ></div>

            <div
              id="sliderProgress"
              class="absolute left-0 top-2 h-2 bg-[#6852ed]"
              style="width: 20%"
            ></div>

            <input
              id="lengthSlider"
              type="range"
              min="4"
              max="64"
              value="16"
              class="absolute left-0 top-0 h-5 w-full cursor-pointer appearance-none bg-transparent accent-[#6852ed]"
            />
          </div>

          <!-- RANGE VALUES -->

          <div
            class="mt-1 flex justify-between text-base text-[#727a99] dark:text-[#929bb9]"
          >
            <span>4</span>
            <span>64</span>
          </div>

          <!-- OPTIONS -->

          <div class="mt-6 grid grid-cols-2 gap-2 sm:grid-cols-4">
            <!-- UPPERCASE -->

            <label
              class="group flex min-h-[43px] cursor-pointer items-center gap-2 border-2 border-[#cdd2e9] bg-white px-2.5 text-base text-[#727a99] transition hover:-translate-y-0.5 hover:border-[#6852ed] hover:text-[#171b32] dark:border-[#343c5d] dark:bg-[#151a30] dark:text-[#929bb9] dark:hover:text-white"
            >
              <input
                id="uppercase"
                type="checkbox"
                checked
                class="peer hidden"
              />

              <span
                class="grid h-5 w-5 place-items-center border-2 border-[#cdd2e9] text-transparent peer-checked:border-[#6852ed] peer-checked:bg-[#6852ed] peer-checked:text-white dark:border-[#343c5d]"
              >
                ✓
              </span>

              <span> Uppercase </span>
            </label>

            <!-- LOWERCASE -->

            <label
              class="group flex min-h-[43px] cursor-pointer items-center gap-2 border-2 border-[#cdd2e9] bg-white px-2.5 text-base text-[#727a99] transition hover:-translate-y-0.5 hover:border-[#6852ed] hover:text-[#171b32] dark:border-[#343c5d] dark:bg-[#151a30] dark:text-[#929bb9] dark:hover:text-white"
            >
              <input
                id="lowercase"
                type="checkbox"
                checked
                class="peer hidden"
              />

              <span
                class="grid h-5 w-5 place-items-center border-2 border-[#cdd2e9] text-transparent peer-checked:border-[#6852ed] peer-checked:bg-[#6852ed] peer-checked:text-white dark:border-[#343c5d]"
              >
                ✓
              </span>

              <span> Lowercase </span>
            </label>

            <!-- NUMBERS -->

            <label
              class="group flex min-h-[43px] cursor-pointer items-center gap-2 border-2 border-[#cdd2e9] bg-white px-2.5 text-base text-[#727a99] transition hover:-translate-y-0.5 hover:border-[#6852ed] hover:text-[#171b32] dark:border-[#343c5d] dark:bg-[#151a30] dark:text-[#929bb9] dark:hover:text-white"
            >
              <input id="numbers" type="checkbox" checked class="peer hidden" />

              <span
                class="grid h-5 w-5 place-items-center border-2 border-[#cdd2e9] text-transparent peer-checked:border-[#6852ed] peer-checked:bg-[#6852ed] peer-checked:text-white dark:border-[#343c5d]"
              >
                ✓
              </span>

              <span> Numbers </span>
            </label>

            <!-- SYMBOLS -->

            <label
              class="group flex min-h-[43px] cursor-pointer items-center gap-2 border-2 border-[#cdd2e9] bg-white px-2.5 text-base text-[#727a99] transition hover:-translate-y-0.5 hover:border-[#6852ed] hover:text-[#171b32] dark:border-[#343c5d] dark:bg-[#151a30] dark:text-[#929bb9] dark:hover:text-white"
            >
              <input id="symbols" type="checkbox" checked class="peer hidden" />

              <span
                class="grid h-5 w-5 place-items-center border-2 border-[#cdd2e9] text-transparent peer-checked:border-[#6852ed] peer-checked:bg-[#6852ed] peer-checked:text-white dark:border-[#343c5d]"
              >
                ✓
              </span>

              <span> Symbols </span>
            </label>
          </div>

          <!-- GENERATE -->

          <button
            id="generateButton"
            class="mt-5 h-[60px] w-full bg-[#6852ed] text-xl tracking-[3px] text-white shadow-[4px_4px_0_#4632bd] transition hover:bg-[#8068ff] active:translate-x-[3px] active:translate-y-[3px] active:shadow-[1px_1px_0_#4632bd]"
          >
            GENERATE PASSWORD →
          </button>

          <!-- STRENGTH -->

          <div class="mt-5 flex items-center gap-3">
            <span
              id="strengthLabel"
              class="min-w-[85px] text-base tracking-[1px] text-[#727a99] dark:text-[#929bb9]"
            >
              STRONG
            </span>

            <div id="strengthMeter" class="grid flex-1 grid-cols-12 gap-1">
              <span class="strength-block h-2 bg-[#55c878]"></span>
              <span class="strength-block h-2 bg-[#55c878]"></span>
              <span class="strength-block h-2 bg-[#55c878]"></span>
              <span class="strength-block h-2 bg-[#55c878]"></span>
              <span class="strength-block h-2 bg-[#55c878]"></span>
              <span class="strength-block h-2 bg-[#55c878]"></span>

              <span
                class="strength-block h-2 bg-[#cdd2e9] dark:bg-[#343c5d]"
              ></span>
              <span
                class="strength-block h-2 bg-[#cdd2e9] dark:bg-[#343c5d]"
              ></span>
              <span
                class="strength-block h-2 bg-[#cdd2e9] dark:bg-[#343c5d]"
              ></span>
              <span
                class="strength-block h-2 bg-[#cdd2e9] dark:bg-[#343c5d]"
              ></span>
              <span
                class="strength-block h-2 bg-[#cdd2e9] dark:bg-[#343c5d]"
              ></span>
              <span
                class="strength-block h-2 bg-[#cdd2e9] dark:bg-[#343c5d]"
              ></span>
            </div>
          </div>
        </div>
      </section>
    </main>

    <script>
      const LOWERCASE = "abcdefghijklmnopqrstuvwxyz";

      const UPPERCASE = "ABCDEFGHIJKLMNOPQRSTUVWXYZ";

      const NUMBERS = "0123456789";

      const SYMBOLS = "!@#$%^&*()_+-=[]{}|;:,.<>?";

      const password = document.getElementById("password");

      const slider = document.getElementById("lengthSlider");

      const lengthValue = document.getElementById("lengthValue");

      const sliderProgress = document.getElementById("sliderProgress");

      const uppercase = document.getElementById("uppercase");

      const lowercase = document.getElementById("lowercase");

      const numbers = document.getElementById("numbers");

      const symbols = document.getElementById("symbols");

      const generateButton = document.getElementById("generateButton");

      const refreshButton = document.getElementById("refreshButton");

      const copyButton = document.getElementById("copyButton");

      const strengthLabel = document.getElementById("strengthLabel");

      const strengthBlocks = document.querySelectorAll(".strength-block");

      const themeButton = document.getElementById("themeButton");

      const lightBackground = document.getElementById("lightBackground");

      const darkBackground = document.getElementById("darkBackground");

      const sunIcon = document.getElementById("sunIcon");

      const moonIcon = document.getElementById("moonIcon");

      /* RANDOM */

      function randomNumber(max) {
        const array = new Uint32Array(1);

        crypto.getRandomValues(array);

        return array[0] % max;
      }

      /* PASSWORD */

      function generatePassword() {
        let characters = "";

        if (uppercase.checked) {
          characters += UPPERCASE;
        }

        if (lowercase.checked) {
          characters += LOWERCASE;
        }

        if (numbers.checked) {
          characters += NUMBERS;
        }

        if (symbols.checked) {
          characters += SYMBOLS;
        }

        if (!characters) {
          password.textContent = "SELECT AN OPTION";

          updateStrength(0);

          return;
        }

        const length = Number(slider.value);

        let result = "";

        for (let i = 0; i < length; i++) {
          result += characters[randomNumber(characters.length)];
        }

        password.textContent = result;

        updateStrength(calculateStrength());
      }

      /* STRENGTH */

      function calculateStrength() {
        const length = Number(slider.value);

        let types = 0;

        if (uppercase.checked) {
          types++;
        }

        if (lowercase.checked) {
          types++;
        }

        if (numbers.checked) {
          types++;
        }

        if (symbols.checked) {
          types++;
        }

        return Math.min(100, Math.round((length / 64) * 60 + (types / 4) * 40));
      }

      function updateStrength(score) {
        const active = Math.ceil((score / 100) * strengthBlocks.length);

        strengthBlocks.forEach((block, index) => {
          if (index < active) {
            block.classList.remove("bg-[#cdd2e9]", "dark:bg-[#343c5d]");

            block.classList.add("bg-[#55c878]");
          } else {
            block.classList.remove("bg-[#55c878]");

            block.classList.add("bg-[#cdd2e9]", "dark:bg-[#343c5d]");
          }
        });

        if (score >= 80) {
          strengthLabel.textContent = "VERY STRONG";
        } else if (score >= 60) {
          strengthLabel.textContent = "STRONG";
        } else if (score >= 35) {
          strengthLabel.textContent = "FAIR";
        } else {
          strengthLabel.textContent = "WEAK";
        }
      }

      /* SLIDER */

      function updateSlider() {
        const min = Number(slider.min);

        const max = Number(slider.max);

        const value = Number(slider.value);

        const percentage = ((value - min) / (max - min)) * 100;

        sliderProgress.style.width = percentage + "%";

        lengthValue.textContent = value;
      }

      /* COPY */

      copyButton.addEventListener("click", async () => {
        const text = password.textContent;

        if (!text || text === "SELECT AN OPTION") {
          return;
        }

        try {
          await navigator.clipboard.writeText(text);

          copyButton.classList.remove("bg-[#202641]");

          copyButton.classList.add("bg-[#55c878]");

          setTimeout(() => {
            copyButton.classList.remove("bg-[#55c878]");

            copyButton.classList.add("bg-[#202641]");
          }, 900);
        } catch (error) {}
      });

      /* EVENTS */

      slider.addEventListener("input", () => {
        updateSlider();

        generatePassword();
      });

      [uppercase, lowercase, numbers, symbols].forEach((checkbox) => {
        checkbox.addEventListener("change", generatePassword);
      });

      generateButton.addEventListener("click", generatePassword);

      refreshButton.addEventListener("click", generatePassword);

      /* THEME */

      function setTheme(dark) {
        if (dark) {
          document.documentElement.classList.add("dark");

          darkBackground.classList.remove("hidden");

          lightBackground.classList.add("hidden");

          sunIcon.classList.add("hidden");

          moonIcon.classList.remove("hidden");

          localStorage.setItem("theme", "dark");
        } else {
          document.documentElement.classList.remove("dark");

          darkBackground.classList.add("hidden");

          lightBackground.classList.remove("hidden");

          sunIcon.classList.remove("hidden");

          moonIcon.classList.add("hidden");

          localStorage.setItem("theme", "light");
        }
      }

      themeButton.addEventListener("click", () => {
        const dark = !document.documentElement.classList.contains("dark");

        setTheme(dark);
      });

      /* INITIAL THEME */

      const savedTheme = localStorage.getItem("theme");

      if (savedTheme === "dark") {
        setTheme(true);
      } else {
        setTheme(false);
      }

      /* INITIAL UI */

      updateSlider();

      generatePassword();
    </script>
  </body>
</html>
